<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:16px;font-size:13px;color:#24314D;">
  <tr>
    <td style="padding:4px 0;color:#6B7587;">Subtotal</td>
    <td style="padding:4px 0;text-align:right;">{{ subtotal }}</td>
  </tr>
  {% if has_discount %}
  <tr>
    <td style="padding:4px 0;color:#6B7587;">Discount{% if coupon_code %} ({{ coupon_code }}){% endif %}</td>
    <td style="padding:4px 0;text-align:right;color:#0E9F6E;">−{{ discount }}</td>
  </tr>
  {% endif %}
  <tr>
    <td style="padding:4px 0;color:#6B7587;">{% if is_pickup %}Pickup{% else %}Delivery{% endif %}</td>
    <td style="padding:4px 0;text-align:right;">{% if is_pickup %}Free{% else %}{{ shipping_fee }}{% endif %}</td>
  </tr>
  <tr>
    <td style="padding:12px 0 0;border-top:1px solid #E4E7EC;font-weight:800;color:#0A0F1C;font-size:16px;">Total</td>
    <td style="padding:12px 0 0;border-top:1px solid #E4E7EC;text-align:right;font-weight:800;color:#0A0F1C;font-size:16px;">{{ total }}</td>
  </tr>
</table>
