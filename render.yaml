# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates the Django API web service for this repo. In the Render dashboard:
# New → Blueprint → pick this repository. Render prompts for the values marked
# `sync: false` (DATABASE_URL + Cloudinary keys) during creation.
# Full walkthrough: DEPLOY.md.
services:
  - type: web
    name: timelineglobal
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py check && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,timelinegadgets.com,www.timelinegadgets.com"
      - key: FRONTEND_URL
        value: https://timelinegadgets.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://timelinegadgets.com,https://www.timelinegadgets.com
      # Contact-form notifications are emailed here as well as stored in the
      # admin Messages tab. The setting has a code default, repeated here so it
      # is visible in the Render dashboard.
      - key: CONTACT_NOTIFICATION_EMAIL
        value: timelinegadgets4@gmail.com
      # Google OAuth web client ID. Use the same value for VITE_GOOGLE_CLIENT_ID
      # in the Vercel project. A client secret is not needed for the ID-token flow.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Transactional email (EMAIL_SETUP.md). Leave BREVO_API_KEY empty to keep
      # the SMTP/console fallback until the Brevo account is ready.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: Timeline Gadgets
      # The From address. It must sit on a domain that is authenticated in
      # Brevo (DKIM + SPF + DMARC DNS records) — Gmail rejects mail sent from a
      # free-mailbox address instead of delivering it. See EMAIL_SETUP.md.
      - key: BREVO_SENDER_EMAIL
        value: no-reply@timelinegadgets.com
      # Replies go to a mailbox that is actually watched.
      - key: BREVO_REPLY_TO_EMAIL
        value: timelinegadgets4@gmail.com
      # Token for POST /api/emails/maintenance/retry/ (and the cron job below).
      - key: MAINTENANCE_TOKEN
        generateValue: true

# Failed transactional emails are retried on a schedule. The command is
# idempotent: it only picks up messages that are pending or retryable.
# The cron job needs the same secrets as the web service (the same values
# have to be entered when the blueprint is created).
# NOTE: Render cron jobs need a paid instance. On the free plan the hourly
# GitHub Actions job (.github/workflows/maintenance.yml) does the same sweep
# through POST /api/emails/maintenance/retry/ — it only needs MAINTENANCE_TOKEN
# to be set on Render and as a repository secret.
cronJobs:
  - type: cron
    name: retry-failed-emails
    schedule: "*/10 * * * *"
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py retry_failed_emails
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,timelinegadgets.com,www.timelinegadgets.com"
      - key: FRONTEND_URL
        value: https://timelinegadgets.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://timelinegadgets.com,https://www.timelinegadgets.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: Timeline Gadgets
      - key: BREVO_SENDER_EMAIL
        value: no-reply@timelinegadgets.com
      - key: BREVO_REPLY_TO_EMAIL
        value: timelinegadgets4@gmail.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
